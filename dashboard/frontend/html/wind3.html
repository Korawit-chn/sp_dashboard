<!DOCTYPE html>
<html>
<head>
  <title>Wind Speed Dashboard</title>

  <!-- Vendored, NOT a CDN. The site has no internet, and these used to load
       from cdn.jsdelivr.net - which meant the BROWSER had to reach the
       internet, not the server. It worked until the browser's cache of them
       expired (the URLs were unversioned, so jsDelivr caches them for about a
       week), and then every chart silently stopped drawing while the rest of
       the page carried on. Served by express.static out of frontend/, so
       nothing but these paths has to change. See js/vendor/README.md. -->
  <script src="../js/vendor/echarts.min.js"></script>


  <link rel="stylesheet" href="../style.css">

  <style>
    #chartContainer {
      width: 90vw;
      height: 80vh;
      margin: auto;
    }

    #roseChart {
      width: 100%;
      height: 100%;
    }
  </style>

</head>

<body>
  <a href="index.html">Temp/Humidity/VPD</a> |
  <a href="wind3.html">Wind</a>
  <hr>

  <h2>Wind Speed Dashboard</h2>

  <!-- Built by renderTimeControls() in js/common.js - the same control the
       main page uses. It used to be hand-written markup here plus
       setupTimeControls() in wind3.js, which the main page had no copy of at
       all. -->
  <div id="timeControls" class="panel"></div>


  <div id="checkboxes"></div>

  <div id="chartContainer">
    <div id="roseChart" style="width:100%; height:100%;"></div>
  </div>




  <!-- config.js, sensorColors.js, then common.js - see index.html. -->
  <script src="../js/config.js"></script>
  <script src="../js/sensorColors.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/wind3.js"></script>
</body>
</html>

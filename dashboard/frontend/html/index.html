<!DOCTYPE html>
<html>
  <a href="index.html">Temp/Humidity/VPD</a> |
<a href="wind3.html">Wind</a>
<hr>

<head>
  <title>Sensor Dashboard</title>

  <!-- Vendored, NOT a CDN. The site has no internet, and these used to load
       from cdn.jsdelivr.net - which meant the BROWSER had to reach the
       internet, not the server. It worked until the browser's cache of them
       expired (the URLs were unversioned, so jsDelivr caches them for about a
       week), and then every chart silently stopped drawing while the rest of
       the page carried on. Served by express.static out of frontend/, so
       nothing but these paths has to change. See js/vendor/README.md. -->
  <script src="../js/vendor/chart.umd.min.js"></script>
  <script src="../js/vendor/chartjs-adapter-date-fns.bundle.min.js"></script>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
  <h2>Sensor Dashboard</h2>

  <h3>Sampling interval</h3>
  <div class="panel">
    <label>
      <span id="periodLabel">Period (seconds):</span>
      <!-- min/max are set from GET /api/config at load; these are only a
           sensible starting point if that call fails. -->
      <input type="number" id="periodInput" min="2" max="3600" step="1" size="5">
    </label>
    <!-- Two different things. Period is how often a sensor READS, and every Pi
         switches it on the same instant. Upload is how often a Pi SENDS what it
         has read; readings are cached locally in between, so a long upload
         interval loses nothing and does not make a Pi look offline - the
         heartbeat is separate and stays at 60 s. -->
    <label>
      <span id="sendLabel">Upload every (seconds):</span>
      <input type="number" id="sendInput" min="5" max="3600" step="1" size="5">
    </label>
    <button id="applyPeriod">Apply to all sensors</button>
    <span id="scheduleStatus" class="muted">loading...</span>
    <div id="clockSkew" class="muted"></div>
  </div>

  <h3>Mist makers</h3>
  <div id="mistNote" class="muted"></div>
  <div id="mistPanels"></div>

  <h3>Fans</h3>
  <div id="fanNote" class="muted"></div>
  <div id="fanPanels"></div>

  <h3>Devices</h3>
  <div id="deviceNote" class="muted"></div>
  <table id="deviceTable">
    <thead>
      <tr>
        <th>ID</th><th>Device</th><th>State</th><th>Last seen</th><th>Booted at</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h3>Time range</h3>
  <div id="timeControls" class="panel"></div>

  <h3>Sensors</h3>
  <div id="checkboxes"></div>

  <h3>Temperature</h3>
  <canvas id="tempChart" height="100"></canvas>

  <h3>Humidity</h3>
  <canvas id="humiChart" height="100"></canvas>

  <h3>VPD</h3>
  <canvas id="VPDChart" height="100"></canvas>

  <!-- config.js, then sensorColors.js, then common.js: common.js reads
       window.CONFIG and defines API, api(), formatAge(), toNumber(),
       getSelectedSensors() and renderSensorCheckboxes(), and that last one
       calls sensorColor(). The three panel scripts below are independent of
       each other and may be reordered. -->
  <script src="../js/config.js"></script>
  <script src="../js/sensorColors.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/devices.js"></script>
  <script src="../js/actuators.js"></script>
  <script src="../js/script.js"></script>
</body>
</html>
